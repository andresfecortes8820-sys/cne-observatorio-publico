services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: social
      POSTGRES_DB: social
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta scripts/setup_env.py}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U social]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  migrate:
    build: ./backend
    env_file: .env
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./backend
    env_file: .env
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: ./backend
    env_file: .env
    command: [celery, -A, app.tasks.celery, worker, --loglevel=warning, --concurrency=2]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  scheduler:
    build: ./backend
    env_file: .env
    command: [celery, -A, app.tasks.celery, beat, --loglevel=warning, --schedule=/tmp/celerybeat]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ['127.0.0.1:3000:3000']
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:

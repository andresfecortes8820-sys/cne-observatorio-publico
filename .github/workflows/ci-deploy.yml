name: Validate and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: social
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: social_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U social"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://social:ci-only-password@localhost:5432/social_test
      DATABASE_URL: postgresql+psycopg://social:ci-only-password@localhost:5432/social_test
      JWT_SECRET: ci-only-secret-not-a-production-credential-123456
      TOKEN_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      ADMIN_PASSWORD: ci-admin-password-not-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Apply and reverse migrations on PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Build production Docker images
        working-directory: .
        run: |
          docker build -t cne-web:ci frontend
          docker build -t cne-api:ci backend
      - name: Validate production Compose
        working-directory: .
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=ci-only-password PUBLIC_DOMAIN=example.org docker compose -f compose.production.yaml config --quiet
  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$PUBLIC_URL"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload exact validated source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip > /tmp/source.tar.gz
          scp -o StrictHostKeyChecking=yes /tmp/source.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/cne/incoming.tar.gz"
      - name: Deploy and verify
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash /opt/cne/deploy-release.sh'
          curl --fail --retry 10 --retry-delay 6 "$PUBLIC_URL/api/public/accounts"
          curl --fail "$PUBLIC_URL/" >/dev/null
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

name: Public dashboard on GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - name: Verify official connectors and privacy boundaries
        run: python -m pytest -q backend/tests
      - name: Collect only approved official sources
        run: python scripts/collect_public.py
        env:
          API_SYNC_ENABLED: ${{ vars.API_SYNC_ENABLED }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      - name: Preserve sanitized public observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/observatory.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update authorized public observations [skip ci]'
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: node --test frontend/tests/snapshot.test.mjs
      - run: node scripts/build_pages.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: /cne-observatorio-publico
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish the verified static dashboard
        id: publish
        uses: actions/deploy-pages@v4
